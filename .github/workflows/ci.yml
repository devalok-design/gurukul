name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No lockfile is committed in this repo (dropped in 1ff316f), so there is
      # nothing for `npm ci` or `cache: npm` to read. Resolve fresh, exactly as
      # the Railway build does. Switch back to `npm ci` once a factory-generated
      # package-lock.json lands on main.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
